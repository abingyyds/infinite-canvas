log_format canvas_access '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log canvas_access;
    add_header Referrer-Policy "no-referrer" always;

    location /official-plugins/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 资源名带 hash，浏览器留着旧的 index.html 就会一直加载旧包，所以这一份必须每次回源校验。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    # 内置 Go 后端只在容器内监听 API_PORT，由 nginx 对外转发 /api/*。
    location /api/ {
        proxy_pass http://127.0.0.1:${API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 生成请求耗时长且需要流式输出。
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        client_max_body_size 64m;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
